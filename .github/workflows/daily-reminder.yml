name: Daily NUS deadline reminder

on:
  schedule:
    # GitHub cron is UTC. 00:00 UTC is 08:00 in Singapore (year-round).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nus-canvas-daily-reminder
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # A public template has no secrets. Avoid failing scheduled runs until
      # each student has configured their own copy. Manual runs fail clearly.
      - name: Check personal configuration
        id: config
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -n "$CANVAS_TOKEN" && -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo '::error::Add CANVAS_TOKEN, TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets.'
            exit 1
          else
            echo '::notice::Not configured: scheduled digest skipped. See README Quick start.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        if: steps.config.outputs.ready == 'true'
        run: python -m unittest discover -s tests -v

      - name: Send personal Telegram digest
        if: steps.config.outputs.ready == 'true'
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REMINDER_DAYS: ${{ vars.REMINDER_DAYS || '7' }}
          URGENT_HOURS: ${{ vars.URGENT_HOURS || '48' }}
        run: python reminder.py
